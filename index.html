<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Hotel Booking</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>

<div class="logo">
LuxuryStay
</div>

<nav>

<a href="#">Home</a>
<a href="#">Rooms</a>
<a href="#">Services</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>

</nav>

</header>

<section class="hero">

<div class="overlay">

<h1>Find Your Perfect Hotel</h1>

<p>Book luxury hotels with the best prices.</p>

<div class="booking">

<input type="text" placeholder="Destination">

<input type="date">

<input type="date">

<select>

<option>Guests</option>
<option>1 Guest</option>
<option>2 Guests</option>
<option>3 Guests</option>

</select>

<button>Search</button>

</div>

</div>

</section>

<section class="rooms">

<h2>Popular Rooms</h2>

<div class="cards">

<div class="card">

<img src="images/room1.jpg">

<h3>Deluxe Room</h3>

<p>$120 / Night</p>

<button>Book Now</button>

</div>

<div class="card">

<img src="images/room2.jpg">

<h3>Family Suite</h3>

<p>$220 / Night</p>

<button>Book Now</button>

</div>

<div class="card">

<img src="images/room3.jpg">

<h3>Luxury Villa</h3>

<p>$450 / Night</p>

<button>Book Now</button>

</div>

</div>

</section>

<!-- AI CHAT -->

<div class="chat-button" id="openChat">

<i class="fa-solid fa-robot"></i>

</div>

<div class="chat-box" id="chatBox">

<div class="chat-header">

Hotel AI Assistant

<span id="closeChat">✖</span>

</div>

<div class="messages" id="messages">

<div class="bot">

Hello 👋

How can I help you today?

</div>

</div>

<div class="chat-input">

<input id="userInput" placeholder="Ask me anything...">

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
